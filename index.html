<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Warehouse Live Data Dashboard</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
            background-color: #0f172a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #webgl-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .instruction-banner {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.85);
            color: #cbd5e1;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 13px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
            pointer-events: none;
            backdrop-filter: blur(6px);
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- GLTFLoader CDN -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <!-- OrbitControls CDN -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <!-- Instruction Banner -->
    <div class="instruction-banner">Click any asset in the 3D warehouse to inspect</div>

    <!-- Container for 3D Viewport -->
    <div id="webgl-container"></div>

    <script>
        // Complete database loaded from Logs.csv
        const warehouseData = [
            { Machine: "Inbound Holding Conveyor", JobCard: "675 4gyug", Description: "Proximity switch M8", Location: "Storage Unit B", Quantity: "1,00", Condition: "14.0", Comment: "Dead Spade" },
            { Machine: "Bay Holding Conveyor", JobCard: "798454", Description: "SIMATIC ET 200SP, DIGITAL INPUT MODULE, DI 8X 24VDC STANDARD", Location: "Storage Unit B", Quantity: "12,00", Condition: "85.0", Comment: "Broken Conveyor Belt" },
            { Machine: "Line Belt Conveyor", JobCard: "798454", Description: "SIMATIC DP, ELECTRON. MODULE F. ET 200SP, F-DI 8X24VDC HF", Location: "Storage Unit B", Quantity: "1,00", Condition: "65.0", Comment: "Standard Operation" },
            { Machine: "Re-Route Conveyor", JobCard: "N/A", Description: "Diverter Roller Assembly", Location: "Storage Unit A", Quantity: "2,00", Condition: "72.0", Comment: "Routine Check" },
            { Machine: "Scanner", JobCard: "1555", Description: "Barcode Laser Scanner Module", Location: "Control Room", Quantity: "1,00", Condition: "90.0", Comment: "Optimal" },
            { Machine: "Scanner Conveyor", JobCard: "7985", Description: "Drive Motor Belt", Location: "Bay Area", Quantity: "1,00", Condition: "45.0", Comment: "Wear & Tear" },
            { Machine: "Powerfashion Sorter Conveyor", JobCard: "N/A", Description: "Sorter Belt Unit", Location: "Sorting Zone", Quantity: "1,00", Condition: "89.0", Comment: "Normal" },
            { Machine: "Inbound Sorter Conveyor", JobCard: "N/A", Description: "Inbound Roller Line", Location: "Receiving", Quantity: "1,00", Condition: "90.0", Comment: "Normal" },
            { Machine: "Bay1 Inbound Conveyor", JobCard: "N/A", Description: "Bay 1 Feed Line", Location: "Bay 1", Quantity: "1,00", Condition: "15.0", Comment: "Check Roller" },
            { Machine: "Bay2 Inbound Conveyor", JobCard: "N/A", Description: "Bay 2 Feed Line", Location: "Bay 2", Quantity: "1,00", Condition: "25.0", Comment: "Check Roller" },
            { Machine: "Volumizer 1", JobCard: "N/A", Description: "Volumizer Unit 1", Location: "Main Floor", Quantity: "1,00", Condition: "30.0", Comment: "Operational" },
            { Machine: "Volumizer 1 Conveyor", JobCard: "N/A", Description: "Volumizer 1 Feed Conveyor", Location: "Main Floor", Quantity: "1,00", Condition: "50.0", Comment: "Operational" },
            { Machine: "Volumizer 1 Power Supply", JobCard: "N/A", Description: "Volumizer 1 PSU", Location: "Main Floor", Quantity: "1,00", Condition: "80.0", Comment: "Operational" },
            { Machine: "Volumizer 2", JobCard: "N/A", Description: "Volumizer Unit 2", Location: "Main Floor", Quantity: "1,00", Condition: "20.0", Comment: "Operational" },
            { Machine: "Volumizer 2 Conveyor", JobCard: "N/A", Description: "Volumizer 2 Feed Conveyor", Location: "Main Floor", Quantity: "1,00", Condition: "55.0", Comment: "Operational" },
            { Machine: "Volumizer 2 Power Supply", JobCard: "N/A", Description: "Volumizer 2 PSU", Location: "Main Floor", Quantity: "1,00", Condition: "75.0", Comment: "Operational" }
        ];

        // 1. Setup Scene, Camera, and Renderer
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f172a);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 2000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });

        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // 2. Add Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
        directionalLight.position.set(10, 30, 20);
        scene.add(directionalLight);

        const backLight = new THREE.DirectionalLight(0xffffff, 0.5);
        backLight.position.set(-10, -20, -15);
        scene.add(backLight);

        let warehouseModel = null;
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let highlightedMeshes = [];

        // Normalize names (strips trailing SketchUp/GLB instance suffixes like _1, #2, (1), etc.)
        function cleanInstanceName(raw = "") {
            return String(raw)
                .replace(/#\d+$/, "")
                .replace(/_\d+$/, "")
                .replace(/\(\d+\)$/, "")
                .trim();
        }

        function normalizeName(str = "") {
            return cleanInstanceName(str).toLowerCase().replace(/[^a-z0-9]/g, "");
        }

        function getAncestorChain(obj) {
            const chain = [];
            let curr = obj;
            while (curr && curr !== scene) {
                if (curr.name && curr.name.trim() !== "") {
                    chain.push(curr.name.trim());
                }
                curr = curr.parent;
            }
            return chain;
        }

        function getMatchScore(obj, targetKey) {
            const chain = getAncestorChain(obj);
            let bestScore = 0;

            for (const rawName of chain) {
                const norm = normalizeName(rawName);
                if (!norm) continue;

                // Score 3: Exact match on instance/node name (prevents "Volumizer 1" from matching "Volumizer 1 Conveyor")
                if (norm === targetKey) {
                    return 3;
                }
                // Score 2: Starts with targetKey followed by an instance number only (e.g., "volumizer1_01")
                const escapedTarget = targetKey.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
                if (new RegExp("^" + escapedTarget + "\\d+$").test(norm) && bestScore < 2) {
                    bestScore = 2;
                }
            }

            return bestScore;
        }

        function clearHighlights() {
            highlightedMeshes.forEach(({ mesh, originalMaterial }) => {
                if (mesh.material && mesh.material !== originalMaterial) {
                    if (Array.isArray(mesh.material)) {
                        mesh.material.forEach((m) => m.dispose());
                    } else {
                        mesh.material.dispose();
                    }
                }
                mesh.material = originalMaterial;
            });
            highlightedMeshes = [];
        }

        function applyEmissiveHighlight(material) {
            const cloned = material.clone();
            if (cloned.emissive) {
                cloned.emissive.setHex(0x00e5ff);
                cloned.emissiveIntensity = 0.85;
            }
            return cloned;
        }

        function applyAssetFilter(rawAsset) {
            if (!warehouseModel) return;

            clearHighlights();

            const decodedAsset = decodeURIComponent(rawAsset || "").trim();
            if (!decodedAsset || decodedAsset.toUpperCase() === "ALL") {
                return;
            }

            const targetKey = normalizeName(decodedAsset);
            if (!targetKey) return;

            const exactMatches = [];
            const numberedInstanceMatches = [];

            warehouseModel.traverse((child) => {
                if (!child.isMesh) return;
                const score = getMatchScore(child, targetKey);
                if (score === 3) exactMatches.push(child);
                else if (score === 2) numberedInstanceMatches.push(child);
            });

            // Use exact matches first so "Volumizer 1" does not accidentally highlight "Volumizer 1 Conveyor"
            const matchedObjects = exactMatches.length > 0 ? exactMatches : numberedInstanceMatches;

            if (matchedObjects.length > 0) {
                const focusBox = new THREE.Box3();

                matchedObjects.forEach((mesh) => {
                    const originalMaterial = mesh.material;
                    mesh.material = Array.isArray(originalMaterial)
                        ? originalMaterial.map(applyEmissiveHighlight)
                        : applyEmissiveHighlight(originalMaterial);

                    highlightedMeshes.push({ mesh, originalMaterial });
                    focusBox.expandByObject(mesh);
                });

                if (!focusBox.isEmpty()) {
                    const targetCenter = focusBox.getCenter(new THREE.Vector3());
                    controls.target.copy(targetCenter);
                    controls.update();
                }

                console.log(`Matched ${matchedObjects.length} mesh(es) for exact/instance asset:`, decodedAsset);
            } else {
                const availableNames = [];
                warehouseModel.traverse((node) => {
                    if (node.name && node.name.trim() !== "") {
                        availableNames.push(cleanInstanceName(node.name));
                    }
                });
                console.warn("No exact/instance 3D match found for:", decodedAsset);
                console.log("Available instance/node names:", [...new Set(availableNames)].slice(0, 60));
            }
        }

        // 3. Load the GLB File
        const loader = new THREE.GLTFLoader();
        loader.load(
            'Warehouse-optimized.glb',
            function (gltf) {
                warehouseModel = gltf.scene;
                scene.add(warehouseModel);

                const box = new THREE.Box3().setFromObject(warehouseModel);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());

                // Closer framing than before
                const maxDim = Math.max(size.x, size.y, size.z);
                camera.position.set(center.x, center.y + maxDim * 0.35, center.z + maxDim * 0.72);
                controls.target.copy(center);
                controls.update();

                // Apply initial ?asset= query parameter from Power BI iframe URL
                const params = new URLSearchParams(window.location.search);
                const initialAsset = params.get("asset");
                if (initialAsset) {
                    applyAssetFilter(initialAsset);
                }
            },
            undefined,
            function (error) {
                console.log('Error loading GLB:', error);
            }
        );

        // 4. Click Interaction with Deep Ancestor Chain Scanning & Exact-First Matching
        window.addEventListener('click', onPointerDown, false);

        function onPointerDown(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            if (!warehouseModel) return;

            const intersects = raycaster.intersectObjects(warehouseModel.children, true);

            if (intersects.length > 0) {
                const hitObject = intersects[0].object;
                const namesInChain = getAncestorChain(hitObject);

                console.log("=== Clicked Node Chain ===", namesInChain);

                let matchedRecord = null;
                let resolvedName = "Unknown Asset";

                // Pass 1: Look for an exact normalized match first (e.g., "Volumizer 1" vs "Volumizer 1 Conveyor")
                for (const name of namesInChain) {
                    const cleanNorm = normalizeName(name);
                    matchedRecord = warehouseData.find((d) => normalizeName(d.Machine) === cleanNorm);
                    if (matchedRecord) {
                        resolvedName = matchedRecord.Machine;
                        break;
                    }
                }

                // Pass 2: Fallback partial match only if no exact name matched
                if (!matchedRecord) {
                    for (const name of namesInChain) {
                        const cleanName = cleanInstanceName(name).toLowerCase();
                        matchedRecord = warehouseData.find((d) =>
                            cleanName.includes(d.Machine.toLowerCase()) ||
                            d.Machine.toLowerCase().includes(cleanName)
                        );
                        if (matchedRecord) {
                            resolvedName = matchedRecord.Machine;
                            break;
                        }
                    }
                }

                if (!matchedRecord) {
                    const fallbackName = [...namesInChain].reverse().find((n) =>
                        !n.startsWith("Assembly") &&
                        !n.startsWith("Geom") &&
                        !n.startsWith("mesh") &&
                        !n.toLowerCase().includes("roller")
                    ) || namesInChain[0] || "Standard Asset";

                    resolvedName = cleanInstanceName(fallbackName);
                }

                console.log("Resolved Machine Name for Power BI Link:", resolvedName);
            }
        }

        // Handle window resizing
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // 5. Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
